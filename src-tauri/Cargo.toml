[package]
name = "easy-app"
version = "1.0.1"
description = "EAsy - Asistente de League of Legends"
edition = "2021"

[lib]
name = "easy_app"
path = "src/lib.rs"

[[bin]]
name = "EAsy"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "native-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
xcap = "0.9"
image = "0.25"
strsim = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
    "Foundation",
    "Media_Ocr",
    "Globalization",
    "Graphics_Imaging",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi"
] }
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2", features = [] }
